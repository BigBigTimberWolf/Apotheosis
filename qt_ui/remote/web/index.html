<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Apotheosis · 局域网调参</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header><div class="brand"><span class="mark">A</span><div>APOTHEOSIS<small>局域网调参</small></div></div><span id="connection" class="badge">正在连接</span></header>
  <div class="workspace">
    <aside>
      <div class="eyebrow">当前配置文件</div><h2 id="profile">—</h2>
      <p id="activeGroup" class="muted"></p>
      <label class="selector">筛选分组<select id="group"></select></label>
      <label class="selector">编辑配置<select id="scope"></select></label>
      <label class="selector">搜索参数<input id="search" type="search" placeholder="例如：跟随、FOV、Kp"></label>
      <nav id="sections" aria-label="参数分类"></nav>
      <p class="aside-note">参数应用到运行 Apotheosis 的电脑。<br>修改后点击下方按钮生效。</p>
    </aside>
    <main>
      <div class="intro"><div class="eyebrow">PARAMETER WORKSPACE</div><h1 id="title">连接你的调参工作台</h1><p id="note">正在读取当前参数…</p></div>
      <div id="message" role="status" aria-live="polite"></div>
      <form id="form"><div id="cards"></div></form>
      <div id="empty" hidden>没有匹配的参数。</div>
    </main>
  </div>
  <footer><div><strong id="dirty">尚未连接</strong><small id="saveHint">网页内修改不会立即生效</small></div><div class="footer-actions"><button id="reload" type="button">重新读取</button><button id="apply" type="button" class="primary" disabled>应用并保存</button></div></footer>
</body>
</html>
