[env:RIGHT]
platform = espressif32 @ 6.7.0
board = MAKCM ; Devkit
; ★ 关键: 必须显式指定本工程的 boards/ 目录。
; 平台包 (piocore/platforms/espressif32/boards/) 里【没有】MAKCM.json,
; 缺了这一行 PlatformIO 会静默回退到通用 ESP32-S3 板定义, 于是
; boards/MAKCM.json 里的 extra_flags(USB_MODE / CDC_ON_BOOT / PSRAM)
; 全部被忽略 —— 那正是"代码怎么改都没用"的真正原因。
board_dir = boards
framework = arduino
lib_deps = 
  ArduinoJson
  locoduino/RingBuffer@^1.0.5
extra_scripts = scripts/merge.py
board_build.partitions = partitions/partition_MAKCM.csv

build_flags = 
  -DUSB_IS_DEBUG=false ;  true
  -DFIRMWARE_VERSION="V1_2"
  -DFW_DIAG=0
  -DFW_BOOTTEST=0
  -DFW_USBSTAGE=0
  ; -DCORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_DEBUG

; 右板诊断构建: 每 2 秒把 USB Host 状态经板间链路发给左板, 左板转到 CH343;
; 并用 LED9 闪码编码 PHY 值与端点传输数。同时【禁用 efuse 烧写】——
; USB_PHY_SEL 决定 PHY 给 Device 还是 Host, 烧错不可逆。
; 产物名 Right_MAKCM_MCU_MCU_DIAG_V1_2.bin
[env:DIAG]
extends = env:RIGHT
build_flags = 
  -DUSB_IS_DEBUG=false
  -DFIRMWARE_VERSION="DIAG_V1_2"
  -DFW_DIAG=1
  -DFW_BOOTTEST=0

; 最小启动自检: 不初始化 USB / Serial1, 只用 LED9 闪灯。
;
; 用途: 现象是"灯不亮 + 不动"。灯只在收到 USB 报文时才闪, 所以"不亮"无法
; 区分【固件没跑起来】与【USB 收不到数据】。本构建把 USB 整条链路的变量
; 全部移除, 只回答一个问题: 这块板上的固件到底能不能启动?
;   看到 3 次长闪后转为持续快闪 => 固件、时钟、启动、GPIO9 全正常,
;                                问题 100% 在 USB 逻辑;
;   仍然完全不亮              => 问题在更底层(bootloader/分区表/板级配置/硬件)。
; 产物名 Right_MAKCM_MCU_MCU_BOOTTEST_V1_2.bin
[env:BOOTTEST]
extends = env:RIGHT
build_flags = 
  -DUSB_IS_DEBUG=false
  -DFIRMWARE_VERSION="BOOTTEST_V1_2"
  -DFW_DIAG=0
  -DFW_BOOTTEST=1
  -DFW_USBSTAGE=0

; USB 分级诊断: 逐级初始化 USB, 用 LED9 脉冲个数报告卡点。
; 已实测确认固件启动正常(见 BOOTTEST), 因此把变量收敛到 USB 内部这一条链路。
; 读数方式: 每轮 n 个短脉冲(120ms), 数脉冲个数即可。
;   1 = usb_host_install 失败(PHY 没拿到, 最可疑)
;   2 = client_register 失败
;   3 = 装好了但枚举不到任何设备(C 口没认到鼠标)
;   4 = 枚举到但打不开/取不到配置描述符
;   5 = 全部成功(设备已枚举) —— 此时问题在报文收取/解码/发送
; 产物名 FW_HOST_MAKCM_MCU_MCU_USBSTAGE_V1_2.bin
[env:USBSTAGE]
extends = env:RIGHT
build_flags = 
  -DUSB_IS_DEBUG=false
  -DFIRMWARE_VERSION="USBSTAGE_V1_2"
  -DFW_DIAG=0
  -DFW_BOOTTEST=0
  -DFW_USBSTAGE=1

