[env:LEFT]
platform = espressif32 @ 6.7.0
board = MAKCM ; Devkit
; ★ 关键: 同 fw_host, 必须显式指定本工程的 boards/ 目录。
; 平台包里没有 MAKCM.json, 缺这行会静默回退到通用板定义, boards/MAKCM.json
; 的 extra_flags 全部失效(左板需要 Device 侧 USB 配置)。
board_dir = boards
framework = arduino
lib_deps = 
  ArduinoJson
  locoduino/RingBuffer@^1.0.5
extra_scripts = scripts/merge.py
board_build.partitions = partitions/partition_MAKCM.csv

build_flags = 
  -DUSB_IS_DEBUG=false ;  true
  -DFIRMWARE_VERSION="CUSTOM_V1_0"
  -O2
  ; ★ 直写 TinyUSB 描述符层 (取代 Arduino USBHID)
  ;
  ; 为什么要关掉 Arduino 的 USB:
  ;   ARDUINO_USB_CDC_ON_BOOT=1(板子默认) 会让 arduino-esp32 自建 USB 栈,
  ;   用【它自己的】描述符和 HID 回调完成枚举, 我们 usb_desc.cpp / usb_hid.cpp
  ;   的强定义会被绕过 —— 设备仍以单接口 HidUsb 出现, 键盘不被识别。
  ;   置 0 后 Arduino 完全不碰 USB, 完全交给我们的 tinyusb_init()。
  ;   (调试仍走 USB-B 的 CH343 = UART0, 不受影响)
  -DARDUINO_USB_CDC_ON_BOOT=0
  ; 关掉 CDC_ON_BOOT 后 UART0 的对象名从 Serial0 变为 Serial。
  ; MAKCUNEW 有 300+ 处 Serial0, 用宏统一映射, 不改动业务代码。
  ; (含 Serial0 的标识符如 handleSerial0Speed 会成对改名, 语义一致)
  -DSerial0=Serial

  ; ★ 关掉 Arduino 可能自建的其它 USB 类, 避免与我们的描述符冲突。
  ;   这几条在【已验证可用】的 KBD_PASSTHROUGH 构建里是必需的 ——
  ;   漏掉 CFG_TUD_CDC=0 时, 框架编译出的 esp32-hal-tinyusb.c 会按
  ;   SDK 的 tusb_config.h(CDC=1) 分配 CDC 端点, 与我们的单 HID 接口冲突,
  ;   表现为设备完全不枚举。
  -DCFG_TUD_HID=1
  -DCFG_TUD_CDC=0
  -DCFG_TUD_MSC=0
  -DCFG_TUD_MIDI=0
  -DCFG_TUD_VENDOR=0

; 诊断构建: 每 4 秒把运行状态打到 Serial0(CH343), 并用 LED9 闪烁编码握手进度.
; 同时禁用 eFuse 烧写与超频. 产物名 Left_MAKCM_MCU_MCU_DIAG_V1_0.bin
[env:DIAG]
extends = env:LEFT
build_flags = 
  -DUSB_IS_DEBUG=false
  -DFIRMWARE_VERSION="DIAG_V1_0"
  -DFW_DIAG=1
  -O2

