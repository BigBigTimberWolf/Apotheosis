; ============================================================================
; 左板 —— USB Device 键盘透传 (TinyUSB 原生复合 HID)
;
; 产出: Left_KBD_PASSTHROUGH.bin
; ============================================================================
[platformio]
default_envs = LEFT

[env:LEFT]
platform = espressif32 @ 6.7.0
board = MAKCM
board_dir = boards
framework = arduino
extra_scripts = scripts/merge.py
board_build.partitions = partitions/partition_MAKCM.csv

build_flags =
  -O2
  -DFIRMWARE_VERSION="KBD_PT_V1_0"

  ; ★ 关键: 关掉 Arduino 自带的 USB 栈
  ;
  ;   ARDUINO_USB_CDC_ON_BOOT=1 (板子默认) 会让 arduino-esp32 开机自建一个
  ;   CDC + HID 的 TinyUSB 实例, 用【它自己的】描述符和回调。那样我们的
  ;   usb_desc.cpp / usb_hid.cpp 永远不会被调用, 设备会以单接口 HidUsb 出现,
  ;   键盘依旧不被识别。
  ;
  ;   置 0 后 Arduino 不碰 USB, 完全交给我们的 tinyusb_driver_install()。
  ;   (调试改用 USB-B 的 CH343 口 = Serial0, 不受影响)
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DARDUINO_USB_MODE=1

  ; 关掉 Arduino USBHID/USB 相关代码, 避免与我们的 HID 回调重复定义
  -DCFG_TUD_HID=2
  -DCFG_TUD_CDC=0
  -DCFG_TUD_MSC=0
  -DCFG_TUD_MIDI=0
  -DCFG_TUD_VENDOR=0

  -DCORE_DEBUG_LEVEL=0

; ============================================================================
; 自检构建: 左板自己每 2 秒发一次 'A' 键
;
; 用途: 不依赖右板/真键盘/CH343, 单独验证左板的 USB 通路。
;   被控机能打出 A  -> 左板 USB 完全正常, 问题在串口/右板
;   打不出 A        -> 左板自身有问题
;
; 产物: Left_MAKCM_MCU_MCU_KBD_PT_ST.bin
; ============================================================================
[env:SELFTEST]
extends = env:LEFT
build_flags =
  -O2
  -DFIRMWARE_VERSION="KBD_PT_ST"
  -DKBD_SELFTEST=1
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DARDUINO_USB_MODE=1
  -DCFG_TUD_HID=2
  -DCFG_TUD_CDC=0
  -DCORE_DEBUG_LEVEL=0
