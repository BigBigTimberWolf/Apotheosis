; ============================================================================
; 右板 —— USB Host, 读真键盘原始报文
;
; 产出: Right_KBD_PASSTHROUGH.bin
; ============================================================================
[platformio]
default_envs = RIGHT

[env:RIGHT]
platform = espressif32 @ 6.7.0
board = MAKCM
framework = arduino
lib_deps =
  ArduinoJson
  locoduino/RingBuffer@^1.0.5
extra_scripts = scripts/merge.py
board_build.partitions = partitions/partition_MAKCM.csv

; ============================================================================
; flash 容量声明 2MB —— 与官方预编译固件 V3.4_RIGHT.bin 完全一致
; ============================================================================
;
; 这一行【不是】"新马克起不来"的原因(那个原因见 boards/MAKCM.json 的
; memory_type)。这里只是让镜像头和官方保持一致:
;
;   官方 bootloader 头: e9 04 02 1f ...  -> DIO, 80MHz, sizeCode=1 = 2MB
;   我们的 bootloader 头: e9 03 02 1f ... -> DIO, 80MHz, sizeCode=1 = 2MB
;
; 启动时 esp_flash_spi_init.c 里确实有一句容量检查:
;
;   if (default_chip.size < legacy_chip->chip_size) {   // legacy = g_rom_flashchip
;       ESP_EARLY_LOGE(TAG, "Detected size(%dk) smaller than the size in the "
;                      "binary image header(%dk). Probe failed.", ...);
;       return ESP_ERR_FLASH_SIZE_NOT_MATCH;
;   }
;
; 它只在【实际探测到的容量 < 声称的容量】时才报错。"声称的容量"来自
; g_rom_flashchip.chip_size, 即 ROM 依据【二级 bootloader 镜像头】设置的值。
; 这块板子实测是 4MB(esptool flash_id: Manufacturer c8 / Device 4016 / 4MB),
; 所以声明 2MB 只会触发一句 warning(用 2MB), 声明 4MB 也不会有问题。
;
; 因为分区表最大偏移是 0x160000 = 1.38MB(见 partitions/partition_MAKCM.csv,
; 与官方布局一致), 两种声明都放得下, 所以这里选与官方一致的 2MB。
board_upload.flash_size = 2MB

build_flags =
  -O2
  -DFIRMWARE_VERSION="KBD_PT_V1_0"
  -DUSB_IS_DEBUG=false

  ; 右板是 USB Host, 不需要 Arduino 的 USB Device 栈
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DARDUINO_USB_MODE=1

  ; ★ 临时打开日志, 用于定位启动阶段 flash 初始化失败的原因。
  ;
  ;   之前这里是 -DCORE_DEBUG_LEVEL=0 (全关), 于是 esp_flash_init() 失败时
  ;   它内部那句错误日志被静音 —— 串口里断言之前一片空白, 完全看不到原因。
  ;   官方 platformio.ini 里这行是注释掉的(用默认级别), 我们不该把它关掉。
  ;
  ;   定位完就调回 0。
  -DCORE_DEBUG_LEVEL=5
